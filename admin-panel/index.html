<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murder Game - Admin Giriş</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h2>Yönetim Paneli</h2>
            <p>Sisteme erişmek için giriş yapın.</p>
            
            <!-- Hata Mesajı Kutusu (Başlangıçta gizli) -->
            <div id="errorMsg" class="error-message" style="display: none;"></div>

            <form id="adminLoginForm">
                <div class="input-group">
                    <label for="adminUsername">Kullanıcı Adı</label>
                    <input type="text" id="adminUsername" required placeholder="Admin kullanıcı adınız">
                </div>
                
                <div class="input-group">
                    <label for="adminPassword">Şifre</label>
                    <input type="password" id="adminPassword" required placeholder="Şifreniz">
                </div>

                <button type="submit" id="loginBtn" class="login-btn">Giriş Yap</button>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
