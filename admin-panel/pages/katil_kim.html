<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Katil Kim Yönetimi</title>
    <link rel="stylesheet" href="../css/layout/sidebar.css">
    <link rel="stylesheet" href="../css/components/modals.css">
    <link rel="stylesheet" href="../css/katil_kim.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <h2>Katil Kim Yönetimi</h2>
            <p>Özel senaryo "Katil Kim" modülünü buradan yönetin.</p>
        </header>

        <main class="dashboard-content">
            <div class="center-layout">
                
                <!-- Oyun Kontrol Butonları -->
                <div class="action-buttons-panel">
                    <!-- Oyun ekranı sayfasına yönlendiren buton -->
                    <button id="startGameBtn" class="game-btn start-btn">Oyunu Başlat</button>
                    <button class="game-btn status-btn">Durumu Değiştir</button>
                </div>

                <!-- TÜM TAKIMLARIN SIRALAMASI -->
                <div class="leaderboard-section">
                    <h3>Tüm Takım Sıralaması</h3>
                    <div class="leaderboard-card">
                        <ul id="leaderboardList" class="leaderboard-list">
                            <!-- JS ile takımlar buraya basılacak -->
                        </ul>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Menüden açılacak modallar (Takım oluştur vb.) için konteyner -->
    <div id="modals-container"></div>

    <script type="module" src="../js/katil_kim.js"></script>
</body>
</html>
