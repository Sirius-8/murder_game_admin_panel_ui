<div id="addQuestionModal" class="modal-overlay">
    <div class="modal-box form-card question-form-card">
        <button class="close-modal-btn" data-target="addQuestionModal">&times;</button>
        <h3>Yeni Soru Ekle</h3>
        <form id="addQuestionForm">
            <div class="input-group"><label>Soru Metni</label><textarea name="questionText" rows="3" required></textarea></div>
            <div class="options-grid">
                <div class="input-group"><label>A Şıkkı</label><input type="text" name="optionA" required></div>
                <div class="input-group"><label>B Şıkkı</label><input type="text" name="optionB" required></div>
                <div class="input-group"><label>C Şıkkı</label><input type="text" name="optionC" required></div>
                <div class="input-group"><label>D Şıkkı</label><input type="text" name="optionD" required></div>
            </div>
            <div class="options-grid">
                <div class="input-group"><label>Doğru Cevap</label>
                    <select name="correctAnswer" required>
                        <option value="" disabled selected>Seçiniz</option>
                        <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
                    </select>
                </div>
                <div class="input-group"><label>Soru Puanı</label><input type="number" name="questionPoints" min="1" required></div>
            </div>
            <button type="submit" class="action-btn" id="submitQuestionBtn">Soruyu Kaydet</button>
        </form>
        <div id="addQuestionMsg" class="message-box"></div>
    </div>
</div>
